<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stage Leaderboard — Synora'26 Flagship</title>
  
  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    body {
      background: radial-gradient(circle at center, #0F172A 0%, #020617 100%);
      color: #F8FAFC;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .projector-header {
      padding: 24px 30px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid #1E293B;
    }

    .live-pulse-badge {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #EF4444;
      color: #EF4444;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Auditorium Stage Podium */
    .podium-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 24px;
      margin: 40px 0 50px 0;
    }

    .podium-card {
      background: #1E293B;
      border-radius: 20px 20px 0 0;
      padding: 24px;
      text-align: center;
      width: 300px;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      transition: all 0.3s ease;
    }

    .podium-1 {
      height: 380px;
      border-top: 6px solid #EAB308;
      background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
      order: 2;
    }
    .podium-2 {
      height: 330px;
      border-top: 6px solid #94A3B8;
      background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
      order: 1;
    }
    .podium-3 {
      height: 290px;
      border-top: 6px solid #D97706;
      background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
      order: 3;
    }

    .podium-rank-icon {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    .podium-team-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .podium-score-badge {
      font-size: 1.6rem;
      font-weight: 900;
      font-family: monospace;
      color: #38BDF8;
      margin-top: 12px;
    }

    /* Live Ticker Table */
    .projector-table-card {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }

    .projector-table th {
      background: #1E293B !important;
      color: #94A3B8 !important;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 16px;
    }

    .projector-table td {
      padding: 18px 16px;
      font-size: 1.15rem;
      vertical-align: middle;
      border-color: #1E293B !important;
      color: #E2E8F0;
    }
  </style>
</head>
<body>

  <!-- Projector Topbar -->
  <header class="projector-header">
    <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div class="d-flex align-items-center gap-3">
        <div style="font-size: 2.2rem; color: #38BDF8;">⚙</div>
        <div>
          <h2 class="fw-black mb-0 text-white tracking-wide" style="letter-spacing: 1px;">SYNORA'26 — LIVE EVENT LEADERBOARD</h2>
          <div class="text-secondary small">2-Round Multi-Criteria Grand Standings • Max 200 Marks (100 + 100)</div>
        </div>
      </div>

      <div class="d-flex align-items-center gap-3">
        <span class="live-pulse-badge">
          <span class="pulse-dot" style="background:#EF4444;"></span> LIVE EVENT MODE
        </span>
        <button class="btn btn-outline-light btn-sm" onclick="toggleFullScreen()">
          <i class="bi bi-arrows-fullscreen"></i> Fullscreen
        </button>
        <a href="index.html" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-box-arrow-left"></i> Exit
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container-fluid px-4 py-4">
    
    <!-- Top 3 Stage Podium -->
    <div class="podium-container" id="stagePodiumContainer">
      <!-- Dynamically Injected Top 3 -->
    </div>

    <!-- Live Standings Table -->
    <div class="projector-table-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold text-white mb-0"><i class="bi bi-list-ol text-primary"></i> Real-time Team Standings</h4>
        <span class="badge bg-secondary" id="lastUpdatedTag">Refreshing in 10s...</span>
      </div>

      <div class="table-responsive">
        <table class="table projector-table align-middle mb-0">
          <thead>
            <tr>
              <th style="width: 80px;">Rank</th>
              <th>Team ID &amp; Name</th>
              <th>Domain Track</th>
              <th>Institution</th>
              <th class="text-center">Round 1 (100)</th>
              <th class="text-center">Round 2 (100)</th>
              <th class="text-end">Grand Total (200)</th>
            </tr>
          </thead>
          <tbody id="projectorLeaderboardBody">
            <!-- Dynamically Loaded Rows -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>

  <script>
    let countdown = 10;

    document.addEventListener('DOMContentLoaded', () => {
      loadProjectorData();
      setInterval(loadProjectorData, 10000);
      setInterval(updateCountdown, 1000);
    });

    function updateCountdown() {
      countdown--;
      if (countdown <= 0) countdown = 10;
      const el = document.getElementById('lastUpdatedTag');
      if (el) el.textContent = `Auto-refresh in ${countdown}s`;
    }

    async function loadProjectorData() {
      try {
        const list = await API.request('getLeaderboard');
        renderPodium(list.slice(0, 3));
        renderTable(list);
      } catch (err) {
        console.error("Projector load error", err);
      }
    }

    function renderPodium(top3) {
      const container = document.getElementById('stagePodiumContainer');
      if (!container || top3.length === 0) return;

      const p1 = top3[0] || { teamName: 'TBD', college: '-', grandTotal: 0 };
      const p2 = top3[1] || { teamName: 'TBD', college: '-', grandTotal: 0 };
      const p3 = top3[2] || { teamName: 'TBD', college: '-', grandTotal: 0 };

      container.innerHTML = `
        <!-- Rank 2: Silver -->
        <div class="podium-card podium-2">
          <div class="podium-rank-icon">🥈</div>
          <div class="badge bg-secondary mb-2">2ND PLACE</div>
          <div class="podium-team-name">${p2.teamName}</div>
          <div class="small text-secondary">${p2.college}</div>
          <div class="podium-score-badge">${p2.grandTotal} <span class="fs-6 text-muted">/ 200</span></div>
          <div class="small text-muted mt-2">R1: ${p2.round1 || 0} • R2: ${p2.round2 || 0}</div>
        </div>

        <!-- Rank 1: Gold -->
        <div class="podium-card podium-1">
          <div class="podium-rank-icon">🥇</div>
          <div class="badge bg-warning text-dark mb-2 fw-bold">1ST PLACE GOLD</div>
          <div class="podium-team-name fs-3 text-warning">${p1.teamName}</div>
          <div class="small text-secondary">${p1.college}</div>
          <div class="podium-score-badge text-warning">${p1.grandTotal} <span class="fs-6 text-muted">/ 200</span></div>
          <div class="small text-muted mt-2">R1: ${p1.round1 || 0} • R2: ${p1.round2 || 0}</div>
        </div>

        <!-- Rank 3: Bronze -->
        <div class="podium-card podium-3">
          <div class="podium-rank-icon">🥉</div>
          <div class="badge bg-dark border border-warning text-warning mb-2">3RD PLACE</div>
          <div class="podium-team-name">${p3.teamName}</div>
          <div class="small text-secondary">${p3.college}</div>
          <div class="podium-score-badge">${p3.grandTotal} <span class="fs-6 text-muted">/ 200</span></div>
          <div class="small text-muted mt-2">R1: ${p3.round1 || 0} • R2: ${p3.round2 || 0}</div>
        </div>
      `;
    }

    function renderTable(list) {
      const tbody = document.getElementById('projectorLeaderboardBody');
      if (!tbody) return;

      tbody.innerHTML = list.map((item, idx) => {
        let rankBadge = `<span class="fw-bold text-secondary">#${idx + 1}</span>`;
        if (idx === 0) rankBadge = `<span class="fs-4">🥇</span>`;
        if (idx === 1) rankBadge = `<span class="fs-4">🥈</span>`;
        if (idx === 2) rankBadge = `<span class="fs-4">🥉</span>`;

        return `
          <tr>
            <td>${rankBadge}</td>
            <td>
              <div class="fw-bold text-white">${item.teamName}</div>
              <div class="small text-muted mono">${item.teamId}</div>
            </td>
            <td><span class="badge bg-secondary">${item.domain || 'General'}</span></td>
            <td>${item.college}</td>
            <td class="text-center font-monospace fw-bold text-info">${item.round1}</td>
            <td class="text-center font-monospace fw-bold text-info">${item.round2}</td>
            <td class="text-end font-monospace fw-bold text-warning fs-5">${item.grandTotal} <span class="small text-muted fs-6">/ 200</span></td>
          </tr>
        `;
      }).join('');
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
