<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate Verification — HackTrack | Synora'26</title>
  
  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    body {
      background: #0B132B;
      color: #E2E8F0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .verify-card {
      background: #1C2541;
      border: 1px solid #3A506B;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }
    .verify-badge-authentic {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10B981;
      color: #10B981;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <header class="py-3 border-bottom bg-card shadow-xs">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
        <div class="brand-icon" style="width:36px; height:36px; background:linear-gradient(135deg, #2563EB, #06B6D4); border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:bold;">⚙</div>
        <div>
          <span class="fw-bold fs-5 text-primary">HackTrack</span>
          <span class="badge bg-primary ms-1">Synora'26</span>
        </div>
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm">
        <i class="bi bi-arrow-left"></i> Home
      </a>
    </div>
  </header>

  <!-- Verification Container -->
  <main class="container my-auto py-5" style="max-width: 720px;">
    
    <!-- Search Bar -->
    <div class="mb-4 text-center">
      <div class="d-inline-flex align-items-center gap-2 px-3 py-1 mb-2 rounded-pill border bg-card small text-info">
        <i class="bi bi-shield-check"></i> Public Credential Verification Engine
      </div>
      <h2 class="fw-bold mb-1">Verify Certificate Authenticity</h2>
      <p class="text-secondary small">Validate official participation and merit credentials issued for Synora'26.</p>
      
      <form id="verifySearchForm" class="mt-3">
        <div class="input-group">
          <input type="text" id="verifyIdInput" class="ht-input" placeholder="Enter Certificate ID (e.g. CERT-HT-2026-0001-LDR)..." required>
          <button type="submit" class="btn btn-primary px-4 fw-bold" style="background:#0284C7; border:none;">
            <i class="bi bi-search"></i> Verify
          </button>
        </div>
      </form>
    </div>

    <!-- Verification Result Box -->
    <div id="verifyResultContainer"></div>

  </main>

  <!-- Footer -->
  <footer class="py-3 border-top text-center text-muted small mt-auto">
    ⚙ HackTrack Synora'26 • Cryptographic Verification &amp; Credential Registry
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const certId = params.get('id') || params.get('certId') || '';
      if (certId) {
        document.getElementById('verifyIdInput').value = certId;
        performVerification(certId);
      }

      document.getElementById('verifySearchForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('verifyIdInput').value.trim();
        if (id) performVerification(id);
      });
    });

    async function performVerification(certId) {
      const container = document.getElementById('verifyResultContainer');
      container.innerHTML = `<div class="text-center py-4"><span class="spinner-border spinner-border-sm text-info"></span> Verifying cryptographic signatures in Google Cloud...</div>`;

      try {
        const teams = await API.request('getTeams');
        const certs = await API.request('getCertificates');

        // Match certificate by ID or Team ID
        let foundCert = certs.find(c => (c.certId && c.certId.toLowerCase() === certId.toLowerCase()) || (c.teamId && c.teamId.toLowerCase() === certId.toLowerCase()));
        let matchedTeam = null;

        if (foundCert) {
          matchedTeam = teams.find(t => t.teamId === foundCert.teamId);
        } else {
          matchedTeam = teams.find(t => t.teamId.toLowerCase() === certId.toLowerCase() || (t.leaderEmail && t.leaderEmail.toLowerCase() === certId.toLowerCase()));
          if (matchedTeam) {
            foundCert = {
              certId: certId.startsWith('CERT-') ? certId : `CERT-HT-2026-${matchedTeam.teamId.replace('HT', '')}-LDR`,
              teamId: matchedTeam.teamId,
              teamName: matchedTeam.teamName,
              participantName: matchedTeam.leaderName,
              role: "Team Leader",
              status: "RELEASED",
              releasedAt: "16-AUG-2026"
            };
          }
        }

        if (!matchedTeam) {
          container.innerHTML = `
            <div class="verify-card text-center border-danger">
              <i class="bi bi-x-octagon-fill fs-1 text-danger mb-2"></i>
              <h4 class="fw-bold text-danger">Invalid Certificate Record</h4>
              <p class="text-secondary mb-0">No matching credential was found for ID <code class="mono text-white">${certId}</code> in the official registry.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="verify-card" style="border-left: 5px solid #10B981;">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
              <span class="verify-badge-authentic">
                <i class="bi bi-patch-check-fill fs-5"></i> Official Verified Credential
              </span>
              <span class="badge bg-primary fs-6 mono">${foundCert.certId || certId}</span>
            </div>

            <h3 class="fw-bold text-white mb-1">${foundCert.participantName || matchedTeam.leaderName}</h3>
            <p class="text-info fw-semibold mb-3">${foundCert.role || 'Validated Hackathon Innovator'}</p>

            <div class="p-3 bg-subtle rounded border border-secondary mb-3">
              <div class="row g-2">
                <div class="col-sm-6">
                  <div class="small text-muted text-uppercase fw-bold">Team Name</div>
                  <div class="fw-bold text-white">${matchedTeam.teamName}</div>
                </div>
                <div class="col-sm-6">
                  <div class="small text-muted text-uppercase fw-bold">Team ID</div>
                  <div class="mono text-white">${matchedTeam.teamId}</div>
                </div>
                <div class="col-sm-6">
                  <div class="small text-muted text-uppercase fw-bold">Institution / College</div>
                  <div class="text-white">${matchedTeam.college}</div>
                </div>
                <div class="col-sm-6">
                  <div class="small text-muted text-uppercase fw-bold">Domain Track</div>
                  <div class="badge bg-secondary">${matchedTeam.domain || 'Innovation'}</div>
                </div>
                <div class="col-12 mt-2">
                  <div class="small text-muted text-uppercase fw-bold">Project Title</div>
                  <div class="text-info">"${matchedTeam.projectTitle || 'Autonomous Innovation Prototype'}"</div>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 text-muted small">
              <div><b>Issuing Body:</b> Synora Council of Technology &amp; Innovation</div>
              <div><b>Issue Date:</b> ${foundCert.releasedAt || 'August 16, 2026'}</div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
              <a href="certificate.html?teamId=${matchedTeam.teamId}&name=${encodeURIComponent(foundCert.participantName || matchedTeam.leaderName)}&role=${encodeURIComponent(foundCert.role || 'Team Leader')}&certId=${encodeURIComponent(foundCert.certId || certId)}" class="btn btn-primary btn-sm">
                <i class="bi bi-file-earmark-pdf-fill"></i> View &amp; Print Certificate
              </a>
            </div>
          </div>
        `;

      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
